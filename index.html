<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/icon.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HomesToken</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
  <script>


    window.addEventListener("DOMContentLoaded", () => {

      if (window.Telegram && window.Telegram.WebApp) {
        window.Telegram.WebApp.ready();
        alert("Telegram Web App loaded successfully!");
      } else {
        alert("Telegram Web App not loaded!");
      }


      if (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.initDataUnsafe) {
        const user = window.Telegram.WebApp.initDataUnsafe?.user;

        if (user) {
          const userInfo = `
      Welcome, ${user.first_name}!
      Your Telegram ID: ${user.id}
      Username: ${user.username || "N/A"}
      Full Name: ${user.first_name} ${user.last_name || ""}
      Language: ${user.language_code || "not specified"}
    `;
          alert(userInfo);
          localStorage.setItem("User", user);
        } else {
          alert("User information is unavailable.");
        }
      } else {
        alert("Telegram WebApp SDK not loaded or initDataUnsafe is unavailable.");
        alert(window.Telegram);
        alert(window.Telegram.WebApp);
        alert(window.Telegram.WebApp.initDataUnsafe);
      }
    });
  </script>
</body>

</html>
